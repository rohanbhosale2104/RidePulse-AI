<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Uber Demand Prediction{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-uber">
  <div class="container-fluid">
    <a class="navbar-brand brand-mark" href="/dashboard">
      <span class="dot"></span> Uber<span class="text-muted-uber">Demand</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link nav-link-uber" href="/dashboard"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-link-uber" href="/predict"><i class="fa-solid fa-bolt me-1"></i> Predictor</a>
        </li>
        <li class="nav-item">
          <span class="nav-link nav-link-uber" id="navUsername"><i class="fa-solid fa-user me-1"></i> <span id="usernameLabel">Guest</span></span>
        </li>
        <li class="nav-item">
          <button class="btn btn-uber-outline btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endblock %}

<main class="container-fluid px-3 px-lg-4 py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
